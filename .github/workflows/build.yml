name: CI — Build, Test & Checkstyle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required for dorny/test-reporter to create a Check Run via GITHUB_TOKEN
permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 25 ─────────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Cache Maven local repository ─────────────────────────────────
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── 4. Build all modules (skip tests for compile check) ──────────────
      - name: Compile all modules
        run: mvn clean compile --batch-mode -q

      # ── 5. Run unit tests across all modules ────────────────────────────
      - name: Run unit tests
        run: mvn test --batch-mode -pl auction-shared,auction-server,auction-client

      # ── 6. Publish JUnit test reports ───────────────────────────────────
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      # ── 7. Run Checkstyle across all modules ─────────────────────────────
      - name: Checkstyle
        run: mvn checkstyle:check --batch-mode
